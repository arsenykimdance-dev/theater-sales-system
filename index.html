<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление продажами — Театр Земли & KIM.FILM</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h1 { font-size: 24px; color: #1a1a1a; border-bottom: 2px solid #eaeaea; padding-bottom: 10px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { padding: 10px 20px; border: none; background: #e0e0e0; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .tab-btn.active { background: #333; color: #fff; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button.action-btn { margin-top: 15px; background: #0066cc; color: #fff; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        button.action-btn:hover { background: #004999; }
        button.danger-btn { background: #cc0000; }
        button.danger-btn:hover { background: #990000; }
        .api-block { background: #fff3cd; padding: 10px; border-radius: 4px; margin-bottom: 20px; border: 1px solid #ffeeba; }
        
        /* Стили для чата */
        .chat-box { height: 400px; overflow-y: auto; background: #e9ecef; border: 1px solid #ddd; padding: 15px; margin-top: 20px; border-radius: 4px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 12px; border-radius: 8px; max-width: 85%; line-height: 1.5; white-space: pre-wrap; font-size: 14px; }
        .msg.user { background: #d1e7dd; align-self: flex-end; border: 1px solid #badbcc; }
        .msg.model { background: #fff; align-self: flex-start; border: 1px solid #ccc; }
        .chat-input-area { display: flex; gap: 10px; margin-top: 10px; }
        .chat-input-area textarea { flex-grow: 1; resize: none; }
        
        /* Стили для ссылок */
        .link-row { display: flex; gap: 10px; margin-top: 5px; }
        .link-row button { margin-top: 5px; padding: 0 15px; background: #666; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
<div class="container">
    <h1>Панель управления продажами</h1>
    
    <div class="api-block">
        <label>Введите ваш API-ключ Gemini:</label>
        <input type="password" id="apiKey" placeholder="Вставьте ключ сюда (сохранится в вашем браузере)">
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab(0)">1. Запуск продвижения (Чат)</button>
        <button class="tab-btn" onclick="switchTab(1)">2. Административная часть</button>
    </div>

    <!-- Вкладка 1: Чат с ИИ -->
    <div class="tab-content active">
        <h3>Создание стратегии продвижения курса</h3>
        <label>Выберите курс:</label>
        <select id="courseSelect">
            <option value="Нунчи для бизнеса (Премиум)">Нунчи для бизнеса</option>
            <option value="Нейкрокинестетическая мистификация (Базовый)">Нейкрокинестетическая мистификация</option>
        </select>

        <label>Дата начала продаж:</label>
        <input type="date" id="startDate">

        <label>Дата окончания:</label>
        <input type="date" id="endDate">

        <label>Желаемая итоговая сумма сбора (руб.):</label>
        <input type="text" id="targetSum" placeholder="Например: 500000">

        <div style="display: flex; gap: 10px;">
            <button class="action-btn" onclick="startNewCampaign()">Начать новую стратегию</button>
            <button class="action-btn danger-btn" onclick="clearChat()">Очистить историю чата</button>
        </div>

        <div class="chat-box" id="chatBox">
            <div class="msg model">Добро пожаловать. Заполните параметры выше и нажмите «Начать новую стратегию», либо продолжайте текущий диалог.</div>
        </div>
        
        <div class="chat-input-area">
            <textarea id="chatReply" rows="3" placeholder="Напишите ответ ИИ (например: 'План отличный, давай переходить к шагу 2' или 'Измени тональность на более строгую')..."></textarea>
            <button class="action-btn" style="margin-top:0;" onclick="sendReply()">Отправить<br>ответ</button>
        </div>
    </div>

    <!-- Вкладка 2: Административная часть -->
    <div class="tab-content">
        <h3>Администрирование и база знаний</h3>
        
        <label>Дополнительный контекст (Ссылки на материалы):</label>
        <div id="linksContainer">
            <div class="link-row">
                <input type="url" class="context-link" placeholder="https://vitaly.kim/..." >
            </div>
        </div>
        <button class="action-btn" style="background: #28a745; margin-top: 5px; padding: 5px 10px;" onclick="addLinkField()">+ Добавить ссылку</button>

        <label>Опишите задачу для ИИ:</label>
        <textarea id="adminTask" rows="5" placeholder="Например: Предложи изменения для курса Нунчи, опираясь на ссылки выше..."></textarea>

        <button class="action-btn" onclick="processAdminTask()">Отправить задачу ИИ</button>

        <div class="chat-box" id="adminOutput" style="height: auto; min-height: 100px;">Здесь появится ответ ИИ...</div>
    </div>
</div>

<script>
    // Общие настройки
    const MODEL_URL = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent';
    const SYSTEM_PROMPT = "Ты — интеллигентный и опытный помощник режиссера. Твой тон общения — уважительный, глубокий, петербургский, без дешёвых маркетинговых манипуляций. Ты помогаешь продвигать авторские методики на стыке театра, режиссуры и бизнеса.";
    
    // Инициализация API ключа
    document.getElementById('apiKey').value = localStorage.getItem('gemini_api_key') || '';
    document.getElementById('apiKey').addEventListener('input', (e) => {
        localStorage.setItem('gemini_api_key', e.target.value);
    });

    // Переключение вкладок
    function switchTab(index) {
        const buttons = document.querySelectorAll('.tab-btn');
        const contents = document.querySelectorAll('.tab-content');
        buttons.forEach((btn, i) => {
            btn.classList.toggle('active', i === index);
            contents[i].classList.toggle('active', i === index);
        });
    }

    // --- ЛОГИКА ВКЛАДКИ 1 (ЧАТ) ---
    let chatHistory = JSON.parse(localStorage.getItem('theater_chat_history')) || [];

    // Отрисовка чата при загрузке
    window.onload = () => {
        if (chatHistory.length > 0) renderChat();
    };

    function renderChat() {
        const box = document.getElementById('chatBox');
        box.innerHTML = '';
        chatHistory.forEach(msg => {
            const div = document.createElement('div');
            div.className = `msg ${msg.role}`;
            div.innerText = msg.parts[0].text;
            box.appendChild(div);
        });
        box.scrollTop = box.scrollHeight;
    }

    function clearChat() {
        if(confirm('Точно очистить текущий диалог?')) {
            chatHistory = [];
            localStorage.removeItem('theater_chat_history');
            document.getElementById('chatBox').innerHTML = '<div class="msg model">Чат очищен. Можно начинать новую стратегию.</div>';
        }
    }

    function startNewCampaign() {
        const course = document.getElementById('courseSelect').value;
        const start = document.getElementById('startDate').value;
        const end = document.getElementById('endDate').value;
        const sum = document.getElementById('targetSum').value;

        if(!start || !end || !sum) {
            alert('Пожалуйста, заполните все поля!');
            return;
        }

        const prompt = `Нам нужно продвинуть курс: "${course}". Период продаж: с ${start} по ${end}. Целевая сумма: ${sum} рублей.
ВАЖНОЕ ПРАВИЛО: Мы работаем строго в 3 шага.
ШАГ 1: Сейчас ты предлагаешь ТОЛЬКО краткий концепт стратегии и расписание постов. Полные тексты пока не пиши. Спроси меня, утверждаю ли я концепт.
ШАГ 2: (Только после моего утверждения) Мы совместно прописываем полные тексты постов.
ШАГ 3: (Только после финализации текстов) Ты формируешь готовый итоговый документ (резюме).
Жду твой Шаг 1.`;

        // Очищаем старый чат и начинаем новый
        chatHistory = [{ role: 'user', parts: [{ text: prompt }] }];
        localStorage.setItem('theater_chat_history', JSON.stringify(chatHistory));
        renderChat();
        processChatTurn();
    }

    function sendReply() {
        const text = document.getElementById('chatReply').value.trim();
        if(!text) return;
        
        chatHistory.push({ role: 'user', parts: [{ text: text }] });
        document.getElementById('chatReply').value = '';
        localStorage.setItem('theater_chat_history', JSON.stringify(chatHistory));
        renderChat();
        processChatTurn();
    }

    async function processChatTurn() {
        const apiKey = document.getElementById('apiKey').value.trim();
        if (!apiKey) {
            alert('Введите API-ключ!');
            return;
        }

        const box = document.getElementById('chatBox');
        const loadingDiv = document.createElement('div');
        loadingDiv.className = 'msg model';
        loadingDiv.innerText = 'ИИ печатает...';
        loadingDiv.id = 'loadingMsg';
        box.appendChild(loadingDiv);
        box.scrollTop = box.scrollHeight;

        try {
            const responseText = await fetchGeminiAPI(apiKey, chatHistory);
            
            // Удаляем индикатор загрузки
            document.getElementById('loadingMsg').remove();
            
            // Сохраняем ответ ИИ
            chatHistory.push({ role: 'model', parts: [{ text: responseText }] });
            localStorage.setItem('theater_chat_history', JSON.stringify(chatHistory));
            renderChat();
        } catch (error) {
            document.getElementById('loadingMsg').innerText = 'Ошибка: ' + error.message;
        }
    }

    // --- ЛОГИКА ВКЛАДКИ 2 (АДМИНКА) ---
    function addLinkField() {
        const container = document.getElementById('linksContainer');
        const div = document.createElement('div');
        div.className = 'link-row';
        div.innerHTML = `<input type="url" class="context-link" placeholder="https://..."><button type="button" onclick="this.remove()">X</button>`;
        container.appendChild(div);
    }

    async function processAdminTask() {
        const task = document.getElementById('adminTask').value.trim();
        const apiKey = document.getElementById('apiKey').value.trim();
        const outputBox = document.getElementById('adminOutput');
        
        if(!task) { alert('Введите текст задачи!'); return; }
        if(!apiKey) { alert('Введите API-ключ!'); return; }

        // Собираем все ссылки
        const linkInputs = document.querySelectorAll('.context-link');
        const links = Array.from(linkInputs).map(input => input.value.trim()).filter(val => val !== '');
        
        let finalPrompt = task;
        if (links.length > 0) {
            finalPrompt += "\n\nОбязательно используй информацию из этих источников (рассматривай ссылки как контекст):\n" + links.join("\n");
        }

        outputBox.innerHTML = '<div class="msg model">Анализирую задачу и ссылки...</div>';

        try {
            // Для админки используем одиночный запрос без истории
            const singleHistory = [{ role: 'user', parts: [{ text: finalPrompt }] }];
            const responseText = await fetchGeminiAPI(apiKey, singleHistory);
            outputBox.innerHTML = `<div class="msg model">${responseText}</div>`;
        } catch (error) {
            outputBox.innerHTML = `<div class="msg model" style="color:red;">Ошибка: ${error.message}</div>`;
        }
    }

    // --- ОБЩАЯ ФУНКЦИЯ ЗАПРОСА К API С АВТОПОВТОРОМ ---
    async function fetchGeminiAPI(apiKey, contentsArray) {
        const maxRetries = 3;
        const url = `${MODEL_URL}?key=${apiKey}`;

        for (let attempt = 1; attempt <= maxRetries; attempt++) {
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
                        contents: contentsArray
                    })
                });

                const data = await response.json();

                if (data.error && data.error.code === 503) {
                    if (attempt === maxRetries) throw new Error("Серверы перегружены. Попробуйте через пару минут.");
                    await new Promise(r => setTimeout(r, 2000)); // Ждем 2 секунды
                    continue;
                }
                
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    return data.candidates[0].content.parts[0].text;
                } else {
                    throw new Error('Некорректный ответ ИИ: ' + JSON.stringify(data));
                }
            } catch (error) {
                if (attempt === maxRetries) throw error;
            }
        }
    }
</script>
</body>
</html>
