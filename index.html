<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление продажами — Театр Земли & KIM.FILM</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h1 { font-size: 24px; color: #1a1a1a; border-bottom: 2px solid #eaeaea; padding-bottom: 10px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { padding: 10px 20px; border: none; background: #e0e0e0; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .tab-btn.active { background: #333; color: #fff; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button.action-btn { margin-top: 20px; background: #0066cc; color: #fff; padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button.action-btn:hover { background: #004999; }
        .output-box { margin-top: 20px; background: #f9f9f9; border: 1px solid #ddd; padding: 15px; border-radius: 4px; white-space: pre-wrap; font-family: monospace; max-height: 400px; overflow-y: auto; }
        .api-block { background: #fff3cd; padding: 10px; border-radius: 4px; margin-bottom: 20px; border: 1px solid #ffeeba; }
    </style>
</head>
<body>
<div class="container">
    <h1>Панель управления продажами</h1>
    
    <div class="api-block">
        <label>Введите ваш API-ключ Gemini:</label>
        <input type="password" id="apiKey" placeholder="Вставьте ключ сюда (сохранится в вашем браузере)">
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab(0)">1. Запуск продвижения</button>
        <button class="tab-btn" onclick="switchTab(1)">2. Административная часть</button>
    </div>

    <!-- Вкладка 1 -->
    <div class="tab-content active">
        <h3>Создание стратегии продвижения курса</h3>
        <label>Выберите курс:</label>
        <select id="courseSelect">
            <option value="Нунчи для бизнеса (Премиум)">Нунчи для бизнеса</option>
        </select>

        <label>Дата начала продаж:</label>
        <input type="date" id="startDate">

        <label>Дата окончания:</label>
        <input type="date" id="endDate">

        <label>Желаемая итоговая сумма сбора (руб.):</label>
        <input type="text" id="targetSum" placeholder="Например: 500000">

        <button class="action-btn" onclick="generateCampaign()">Запустить создание стратегии с ИИ</button>

        <div class="output-box" id="campaignOutput">Здесь появится результат работы ИИ...</div>
    </div>

    <!-- Вкладка 2 -->
    <div class="tab-content">
        <h3>Администрирование и база знаний</h3>
        <label>Опишите задачу для ИИ:</label>
        <textarea id="adminTask" rows="5" placeholder="Например: Предложи изменения для курса Нунчи или составь план нового курса..."></textarea>

        <button class="action-btn" onclick="processAdminTask()">Отправить задачу ИИ</button>

        <div class="output-box" id="adminOutput">Здесь появится ответ ИИ...</div>
    </div>
</div>

<script>
    document.getElementById('apiKey').value = localStorage.getItem('gemini_api_key') || '';
    document.getElementById('apiKey').addEventListener('input', (e) => {
        localStorage.setItem('gemini_api_key', e.target.value);
    });

    function switchTab(index) {
        const buttons = document.querySelectorAll('.tab-btn');
        const contents = document.querySelectorAll('.tab-content');
        buttons.forEach((btn, i) => {
            btn.classList.toggle('active', i === index);
            contents[i].classList.toggle('active', i === index);
        });
    }

    async function callGemini(prompt, outputElementId) {
        const apiKey = document.getElementById('apiKey').value.trim();
        const outputBox = document.getElementById(outputElementId);

        if (!apiKey) {
            alert('Пожалуйста, введите ваш API-ключ Gemini в поле сверху!');
            return;
        }

        outputBox.innerText = 'ИИ думает, формирует стратегии...';

        // ИСПРАВЛЕННАЯ СТРОКА: правильная модель (согласно опыту автопостинга)
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${apiKey}`;

        const systemInstruction = "Ты — интеллигентный и опытный помощник режиссера. Твой тон общения — уважительный, глубокий, петербургский, без дешёвых маркетинговых манипуляций. Ты помогаешь продвигать авторские методики на стыке театра, режиссуры и бизнеса.";

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [
                        { role: "user", parts: [{ text: systemInstruction + "\n\n" + prompt }] }
                    ]
                })
            });

            const data = await response.json();
            
            if (data.candidates && data.candidates[0].content.parts[0].text) {
                outputBox.innerText = data.candidates[0].content.parts[0].text;
            } else {
                outputBox.innerText = 'Ошибка ответа ИИ: ' + JSON.stringify(data);
            }
        } catch (error) {
            outputBox.innerText = 'Ошибка соединения: ' + error.message;
        }
    }

    function generateCampaign() {
        const course = document.getElementById('courseSelect').value;
        const start = document.getElementById('startDate').value;
        const end = document.getElementById('endDate').value;
        const sum = document.getElementById('targetSum').value;

        if(!start || !end || !sum) {
            alert('Пожалуйста, заполните все поля!');
            return;
        }

        const prompt = `Нужно составить стратегии продвижения и контент-план для курса: "${course}". 
Период продаж: с ${start} по ${end}. 
Целевая сумма сбора: ${sum} рублей. 
Сделай расписание публикаций (для ВК и Telegram), готовые тексты постов в интеллигентном стиле без пошлого инфоцыганства, а также укажи, какие визуальные материалы (фото/видео) прикрепить к каждому посту.`;

        callGemini(prompt, 'campaignOutput');
    }

    function processAdminTask() {
        const task = document.getElementById('adminTask').value;
        if(!task) {
            alert('Введите текст задачи!');
            return;
        }
        callGemini(task, 'adminOutput');
    }
</script>
</body>
</html>
